title: 'JLB Credit: credential-access tooling delivered through RMM'
status: prepared
prepare:
  trigger:
    document_id: 73
    title: Phishing Abuses RMM Tools for Persistent Access
    url: https://www.microsoft.com/en-us/security/blog/2026/09/29/phishing-abuses-rmm-tools-persistent-access/
    source_id: microsoft_ti
    published_at: '2026-09-29T21:39:27+00:00'
  priority: medium
  relevance_rationale: Credential-access utilities delivered through persistent RMM
    channels inform RB-PIR-4's credential-theft theme and warrant a focused SOC hunt.
    This multi-industry campaign offers useful process and network indicators for
    protecting privileged identities, but provides no specific financial-sector or
    payment-system targeting evidence.
  matched_pirs:
  - RB-PIR-4
  hypothesis: Unauthorised MSP360 access on JLB Credit Windows devices deploys ScreenConnect,
    which transfers and executes credential-access candidate utilities while both
    remote-access channels remain active.
  scope: Search the last 30 days of Defender for Endpoint process, file and network
    telemetry in JLB Credit's Microsoft Sentinel workspace across onboarded Windows
    endpoints and Windows Servers. Prioritise devices used by domain administrators,
    CyberArk operators and Azure subscription owners for RB-PIR-4. Assess RMM authorisation
    against deployment records; the report provides no specific financial-sector or
    payment-system targeting evidence.
  techniques:
