queries:
- id: 164
  kind: behavioural
  title: MSP360 PowerShell downloads followed by ScreenConnect installation
  purpose: Find the reported MSP360-to-PowerShell download behaviour followed by a
    directly attributable silent ClientSetup.msi installation. The one-hour correlation
    window is an analyst inference.
  generated_by: llm
  technique_ids:
  - T1059.001
  - T1105
  - T1218.007
  - T1219
  tables:
  - DeviceProcessEvents
  validation:
    status: schema_valid
    tables:
    - DeviceProcessEvents
    unknown_tables: []
    unknown_columns: []
    messages: []
  benign_explanations:
  - An approved MSP360 workflow deploys ScreenConnect for support or migration.
  - IT staff test redundant remote-support channels on a managed device.
  pivots:
  - Review the PowerShell process tree for intervening shells or installers when direct
    parent correlation is absent.
  - Check ScreenConnect deployment approval, tenant ownership and subsequent service
    activity on DeviceId.
  - Follow DeviceFileEvents for ScreenConnect transfers and execution of credential-access
    candidate utilities.
  kql: |-
    let lookback = 30d;
    let Downloads = DeviceProcessEvents
    | where TimeGenerated >= ago(lookback)
    | where FileName =~ "powershell.exe"
    | where InitiatingProcessFileName =~ "RMM.Agent.exe"
    | where ProcessCommandLine contains "Invoke-WebRequest"
    | where isnotempty(ProcessUniqueId)
    | project DeviceId, DeviceName, DownloadTime = TimeGenerated, PowerShellUniqueId = ProcessUniqueId, DownloadCommand = ProcessCommandLine, DownloadAccount = AccountUpn;
    let Installations = DeviceProcessEvents
    | where TimeGenerated >= ago(lookback)
    | where FileName =~ "msiexec.exe"
    | where ProcessCommandLine contains "ClientSetup.msi" and ProcessCommandLine contains "/qn"
    | where isnotempty(InitiatingProcessUniqueId)
    | project DeviceId, InstallTime = TimeGenerated, InstallerParentUniqueId = InitiatingProcessUniqueId, InstallCommand = ProcessCommandLine, InstallAccount = AccountUpn;
    Downloads
    | join kind=inner Installations on DeviceId, $left.PowerShellUniqueId == $right.InstallerParentUniqueId
    | where InstallTime between (DownloadTime .. DownloadTime + 1h)
    | project DownloadTime, InstallTime, DeviceId, DeviceName, DownloadAccount, InstallAccount, DownloadCommand, InstallCommand, PowerShellUniqueId
- id: 165
  kind: behavioural
  title: ScreenConnect transfers followed by credential-access candidate execution
  purpose: Find reported utility names written by ScreenConnect into its documented
    temporary deployment directory and subsequently executed from the same path. Filenames
    identify candidates, not confirmed credential theft; the one-hour window is an
    analyst inference.
  generated_by: llm
  technique_ids:
  - T1036.005
  - T1072
  - T1105
  tables:
  - DeviceFileEvents
  - DeviceProcessEvents
  validation:
    status: schema_valid
    tables:
    - DeviceFileEvents
    - DeviceProcessEvents
    unknown_tables: []
    unknown_columns: []
    messages: []
  benign_explanations:
  - Approved support personnel deploy password-recovery tooling for a documented recovery
    task.
  - An authorised security assessment reproduces the reported deployment behaviour.
  pivots:
  - Inspect file signatures, provenance and the process tree to establish each utility's
    actual function.
  - Review ScreenConnect session records and RunFile activity for the operator and
    transfer source.
  - Map the execution account and device to privileged roles and CyberArk access records
    before assessing identity exposure.
  kql: |-
    let lookback = 30d;
    let Transfers = DeviceFileEvents
    | where TimeGenerated >= ago(lookback)
    | where ActionType in ("FileCreated", "FileRenamed")
    | where InitiatingProcessFileName in~ ("ScreenConnect.ClientService.exe", "ScreenConnect.WindowsClient.exe", "ScreenConnect.Client.exe")
    | where FolderPath contains "\\Documents\\ScreenConnect\\Temp\\"
    | where FileName in~ ("WebBrowserPassView.exe", "Passwords.EXE", "WindowsSecurity_PIN.exe", "WindowsSecurity_Password.exe", "WindowsPassKey.exe")
    | extend MatchPath = tolower(FolderPath), MatchFile = tolower(FileName)
    | project DeviceId, TransferTime = TimeGenerated, MatchPath, MatchFile, TransferProcess = InitiatingProcessFileName, TransferCommand = InitiatingProcessCommandLine;
    let Executions = DeviceProcessEvents
    | where TimeGenerated >= ago(lookback)
    | where FileName in~ ("WebBrowserPassView.exe", "Passwords.EXE", "WindowsSecurity_PIN.exe", "WindowsSecurity_Password.exe", "WindowsPassKey.exe")
    | where FolderPath contains "\\Documents\\ScreenConnect\\Temp\\"
    | extend MatchPath = tolower(FolderPath), MatchFile = tolower(FileName)
    | project DeviceId, DeviceName, ExecutionTime = TimeGenerated, MatchPath, MatchFile, FileName, FolderPath, AccountUpn, AccountDomain, AccountName, ProcessCommandLine, ProcessUniqueId, ParentProcess = InitiatingProcessFileName, ParentCommand = InitiatingProcessCommandLine;
    Transfers
    | join kind=inner Executions on DeviceId, MatchPath, MatchFile
    | where ExecutionTime between (TransferTime .. TransferTime + 1h)
    | project TransferTime, ExecutionTime, DeviceId, DeviceName, AccountUpn, AccountDomain, AccountName, FileName, FolderPath, TransferProcess, TransferCommand, ParentProcess, ParentCommand, ProcessCommandLine, ProcessUniqueId
- id: 166
  kind: behavioural
  title: Dual RMM network channels around candidate utility execution
  purpose: Correlate ScreenConnect-associated candidate utility execution with contemporaneous
    outbound connections from both MSP360 and ScreenConnect. The 15-minute window
    and ports 80/443 are analyst-selected approximations for the reported web communications;
    this does not establish exfiltration or application-layer protocol.
  generated_by: llm
  technique_ids:
  - T1071.001
  - T1072
  - T1219
  tables:
  - DeviceNetworkEvents
  - DeviceProcessEvents
  validation:
    status: schema_valid
    tables:
    - DeviceNetworkEvents
    - DeviceProcessEvents
    unknown_tables: []
    unknown_columns: []
    messages: []
  benign_explanations:
  - Two approved RMM products coexist during migration or vendor support.
  - Authorised password recovery occurs while both support agents maintain routine
    connections.
  pivots:
  - Compare observed destinations with approved MSP360 and ScreenConnect tenants and
    session records.
  - Inspect network activity initiated by the candidate utility using DeviceId and
    UtilityUniqueId.
  - Review the affected user's Entra sign-ins and privileged access activity after
    execution as an investigative inference, not a behaviour established by this report.
  kql: |-
    let lookback = 30d;
    let Utilities = DeviceProcessEvents
    | where TimeGenerated >= ago(lookback)
    | where FileName in~ ("WebBrowserPassView.exe", "Passwords.EXE", "WindowsSecurity_PIN.exe", "WindowsSecurity_Password.exe", "WindowsPassKey.exe")
    | where InitiatingProcessFileName in~ ("ScreenConnect.ClientService.exe", "ScreenConnect.WindowsClient.exe", "ScreenConnect.Client.exe") or InitiatingProcessParentFileName in~ ("ScreenConnect.ClientService.exe", "ScreenConnect.WindowsClient.exe", "ScreenConnect.Client.exe")
    | project DeviceId, DeviceName, UtilityTime = TimeGenerated, UtilityName = FileName, UtilityPath = FolderPath, UtilityCommand = ProcessCommandLine, UtilityAccount = AccountUpn, UtilityUniqueId = ProcessUniqueId;
    let Channels = DeviceNetworkEvents
    | where TimeGenerated >= ago(lookback)
    | where ActionType == "ConnectionSuccess"
    | where InitiatingProcessFileName in~ ("RMM.Agent.exe", "ScreenConnect.ClientService.exe", "ScreenConnect.WindowsClient.exe", "ScreenConnect.Client.exe")
    | where RemoteIPType == "Public"
    | where RemotePort in (80, 443)
    | extend Channel = iff(InitiatingProcessFileName =~ "RMM.Agent.exe", "MSP360", "ScreenConnect")
    | project DeviceId, ConnectionTime = TimeGenerated, Channel, NetworkProcess = InitiatingProcessFileName, RemoteIP, RemoteUrl, RemotePort;
    Utilities
    | join kind=inner Channels on DeviceId
    | where ConnectionTime between (UtilityTime - 15m .. UtilityTime + 15m)
    | summarize FirstConnection = min(ConnectionTime), LastConnection = max(ConnectionTime), ConnectionCount = count(), ChannelCount = dcount(Channel), ActiveChannels = make_set(Channel, 10), NetworkProcesses = make_set(NetworkProcess, 10), RemoteAddresses = make_set(RemoteIP, 100), RemoteNames = make_set(RemoteUrl, 100), RemotePorts = make_set(RemotePort, 10) by DeviceId, DeviceName, UtilityTime, UtilityName, UtilityPath, UtilityCommand, UtilityAccount, UtilityUniqueId
    | where ChannelCount == 2
    | project UtilityTime, DeviceId, DeviceName, UtilityAccount, UtilityName, UtilityPath, UtilityCommand, UtilityUniqueId, FirstConnection, LastConnection, ConnectionCount, ActiveChannels, NetworkProcesses, RemoteAddresses, RemoteNames, RemotePorts
- id: 167
  kind: ioc_sweep
  title: Retrospective domain IOC sweep
  purpose: Searches 30 days of logs for 7 reported domains. Sentinel TI-map rules
    match new events against ingested indicators; this sweep covers older logs.
  generated_by: template
  technique_ids: []
  tables:
  - DeviceNetworkEvents
  - DeviceEvents
  - DnsEvents
  - EmailUrlInfo
  - UrlClickEvents
  - CommonSecurityLog
  validation:
    status: schema_valid
    tables:
    - CommonSecurityLog
    - DeviceEvents
    - DeviceNetworkEvents
    - DnsEvents
    - EmailUrlInfo
    - UrlClickEvents
    unknown_tables: []
    unknown_columns: []
    messages: []
  benign_explanations:
  - Parked, sinkholed or re-registered domain, or a subdomain on shared hosting or
    dynamic DNS.
  - Mail filters or link scanners resolved the domain without a user visiting it.
  pivots:
  - Identify the process that resolved or connected to the domain and review its parent
    and command line.
  - Check DNS and proxy logs from the same device for first contact and regular beaconing.
  kql: |-
    let lookback = 30d;
    let iocs = dynamic(["adsaw.cfd", "adswre.cfd", "bunstar.harej.si", "ojsuyw.niyari.org", "sdfghj.rd-team.ru", "swedcorry.stefneyv.com", "trews.cfd"]);
    let ioc_terms = dynamic(["adsaw", "adswre", "bunstar", "ojsuyw", "sdfghj", "swedcorry", "trews"]);
    union isfuzzy=true
    (
    DeviceNetworkEvents
    | where TimeGenerated >= ago(lookback)
    | where RemoteUrl has_any (ioc_terms)
    | mv-apply MatchedIndicator = iocs to typeof(string) on (
        where (tostring(parse_url(iff(tolower(tostring(RemoteUrl)) contains "://", tolower(tostring(RemoteUrl)), strcat("https://", tolower(tostring(RemoteUrl))))).Host) == MatchedIndicator or tostring(parse_url(iff(tolower(tostring(RemoteUrl)) contains "://", tolower(tostring(RemoteUrl)), strcat("https://", tolower(tostring(RemoteUrl))))).Host) endswith strcat(".", MatchedIndicator))
    )
    | project TimeGenerated, SourceTable = "DeviceNetworkEvents", MatchedIndicator, Device = tostring(DeviceName), User = tostring(InitiatingProcessAccountUpn), IP = tostring(RemoteIP)
    ),
    (
    DeviceEvents
    | where TimeGenerated >= ago(lookback)
    | where RemoteUrl has_any (ioc_terms)
    | mv-apply MatchedIndicator = iocs to typeof(string) on (
        where (tostring(parse_url(iff(tolower(tostring(RemoteUrl)) contains "://", tolower(tostring(RemoteUrl)), strcat("https://", tolower(tostring(RemoteUrl))))).Host) == MatchedIndicator or tostring(parse_url(iff(tolower(tostring(RemoteUrl)) contains "://", tolower(tostring(RemoteUrl)), strcat("https://", tolower(tostring(RemoteUrl))))).Host) endswith strcat(".", MatchedIndicator))
    )
    | project TimeGenerated, SourceTable = "DeviceEvents", MatchedIndicator, Device = tostring(DeviceName), User = tostring(InitiatingProcessAccountUpn), IP = tostring(RemoteIP)
    ),
    (
    DnsEvents
    | where TimeGenerated >= ago(lookback)
    | where Name has_any (ioc_terms)
    | mv-apply MatchedIndicator = iocs to typeof(string) on (
        where (tostring(parse_url(iff(tolower(tostring(Name)) contains "://", tolower(tostring(Name)), strcat("https://", tolower(tostring(Name))))).Host) == MatchedIndicator or tostring(parse_url(iff(tolower(tostring(Name)) contains "://", tolower(tostring(Name)), strcat("https://", tolower(tostring(Name))))).Host) endswith strcat(".", MatchedIndicator))
    )
    | project TimeGenerated, SourceTable = "DnsEvents", MatchedIndicator, Device = tostring(Computer), User = "", IP = tostring(ClientIP)
    ),
    (
    EmailUrlInfo
    | where TimeGenerated >= ago(lookback)
    | where UrlDomain has_any (ioc_terms)
    | mv-apply MatchedIndicator = iocs to typeof(string) on (
        where (tostring(parse_url(iff(tolower(tostring(UrlDomain)) contains "://", tolower(tostring(UrlDomain)), strcat("https://", tolower(tostring(UrlDomain))))).Host) == MatchedIndicator or tostring(parse_url(iff(tolower(tostring(UrlDomain)) contains "://", tolower(tostring(UrlDomain)), strcat("https://", tolower(tostring(UrlDomain))))).Host) endswith strcat(".", MatchedIndicator))
    )
    | project TimeGenerated, SourceTable = "EmailUrlInfo", MatchedIndicator, Device = "", User = "", IP = ""
    ),
    (
    UrlClickEvents
    | where TimeGenerated >= ago(lookback)
    | where Url has_any (ioc_terms)
    | mv-apply MatchedIndicator = iocs to typeof(string) on (
        where (tostring(parse_url(iff(tolower(tostring(Url)) contains "://", tolower(tostring(Url)), strcat("https://", tolower(tostring(Url))))).Host) == MatchedIndicator or tostring(parse_url(iff(tolower(tostring(Url)) contains "://", tolower(tostring(Url)), strcat("https://", tolower(tostring(Url))))).Host) endswith strcat(".", MatchedIndicator))
    )
    | project TimeGenerated, SourceTable = "UrlClickEvents", MatchedIndicator, Device = "", User = tostring(AccountUpn), IP = tostring(IPAddress)
    ),
    (
    CommonSecurityLog
    | where TimeGenerated >= ago(lookback)
    | where DestinationHostName has_any (ioc_terms) or RequestURL has_any (ioc_terms)
    | mv-apply MatchedIndicator = iocs to typeof(string) on (
        where (tostring(parse_url(iff(tolower(tostring(DestinationHostName)) contains "://", tolower(tostring(DestinationHostName)), strcat("https://", tolower(tostring(DestinationHostName))))).Host) == MatchedIndicator or tostring(parse_url(iff(tolower(tostring(DestinationHostName)) contains "://", tolower(tostring(DestinationHostName)), strcat("https://", tolower(tostring(DestinationHostName))))).Host) endswith strcat(".", MatchedIndicator)) or (tostring(parse_url(iff(tolower(tostring(RequestURL)) contains "://", tolower(tostring(RequestURL)), strcat("https://", tolower(tostring(RequestURL))))).Host) == MatchedIndicator or tostring(parse_url(iff(tolower(tostring(RequestURL)) contains "://", tolower(tostring(RequestURL)), strcat("https://", tolower(tostring(RequestURL))))).Host) endswith strcat(".", MatchedIndicator))
    )
    | project TimeGenerated, SourceTable = "CommonSecurityLog", MatchedIndicator, Device = tostring(Computer), User = tostring(SourceUserName), IP = tostring(DestinationIP)
    )
    | order by TimeGenerated desc
