prepare:
  trigger:
    document_id: 73
    title: Phishing Abuses RMM Tools for Persistent Access
    url: https://www.microsoft.com/en-us/security/blog/2026/09/29/phishing-abuses-rmm-tools-persistent-access/
    source_id: microsoft_ti
    published_at: '2026-09-29T21:39:27+00:00'
  priority: medium
  relevance_rationale: 'The campaign directly answers MO-PIR-4 by showing abuse of
    other RMM software: phishing installs MSP360, which deploys ScreenConnect for
    persistent access and tool execution. Existing vendor remote support makes unauthorized
    RMM activity operationally relevant, although neither TeamViewer nor AnyDesk is
    implicated. Windows IT compromise could threaten engineering data or provide a
    route toward production systems, but no OT access, manufacturing targeting, ransomware,
    or FortiGate exploitation is reported. Missing email telemetry and OT monitoring
    limit investigation coverage.'
  matched_pirs:
  - MO-PIR-4
  hypothesis: Windows endpoints show MSP360 launching PowerShell to retrieve and silently
    install ScreenConnect, followed by persistent services and execution of utilities
    through ScreenConnect.
  scope: |-
    Windows endpoints within the configured lookback. Process queries use streamed endpoint telemetry; the service query requires SecurityEvent 4697 with populated service fields. Compare matches with approved remote-support deployments. Execution: not_run; syntax and runtime behavior remain unverified.
    Environment: Brackwell Precision Engineering Ltd; behavioural window 30 days; IOC sweep window 30 days.
