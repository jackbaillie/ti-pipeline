  evidence:
  - quote: Phishing emails directed users to actor-controlled landing pages that impersonated
      document-sharing portals, invitation workflows, Adobe Reader download pages,
      Zoom installation pages, and business collaboration platforms.
    verified: true
  - quote: The downloaded executables used filenames crafted to resemble legitimate
      business content, meeting invitations, PDF documents, and software installers.
    verified: true
  - quote: After victims downloaded and executed the masqueraded MSP360 installer,
      the binary launched from the user’s Downloads directory under a filename designed
      to resemble a legitimate business document.
    verified: true
  - quote: In observed successful installations, the process continued with elevated
      privileges, allowing deployment of MSP360 components and services.
    verified: true
  - quote: Installation workflows used cmd.exe for logging, prerequisite checks, file
      management, and installation-related tasks.
    verified: true
  - quote: 'The installer also performed prerequisite discovery by enumerating installed
      .NET runtimes using: dotnet –list-runtimes.'
    verified: true
  - quote: MSP360 and ScreenConnect were installed as Windows services to establish
      persistent access.
    verified: true
  - quote: MSP360 created registry Run entries to automatically launch tray application
      components at user logon.
    verified: true
  - quote: The installation routine also modified the Windows Firewall configuration
      by creating an inbound allow rule for the MSP360 agent.
    verified: true
  - quote: The combination of MSP360 and ScreenConnect provided the threat actor with
      redundant remote administration channels and enabled the transfer, execution,
      and management of additional tooling during subsequent stages of the intrusion.
    verified: true
  - quote: Following successful installation of MSP360 RMM, the newly installed RMM.Agent.exe
      service launched PowerShell.
    verified: true
  - quote: MSP360 downloaded ScreenConnect, while the threat actor’s use of ScreenConnect
      was subsequently used to transfer and execute additional tooling on compromised
      endpoints.
    verified: true
  - quote: PowerShell and ScreenConnect communicated with actor-controlled infrastructure
      over HTTP/HTTPS.
    verified: true
  - quote: Payload retrieval and remote access communications occurred over encrypted
      network channels.
    verified: true
  - quote: Multiple cloud-hosted web services were used throughout the delivery and
      command-and-control infrastructure.
    verified: true
  - quote: The downloaded ClientSetup.msi package was installed silently using msiexec.exe
      /qn.
    verified: true
  - quote: MSP360 and ScreenConnect modified registry locations associated with services,
      persistence, credential provider components, protocol handlers, and uninstall
      entries.
    verified: true
  - quote: Several filenames were intentionally chosen to resemble legitimate Windows,
      Microsoft Defender, Phone Link, and security-related components, likely to reduce
      user suspicion and blend into normal operating system activity.
    verified: true
  - quote: The execution of these files occurred through ScreenConnect’s built-in
      RunFile functionality, which allows files to be transferred to and executed
      on managed endpoints.
    verified: true
  - quote: Additional tooling delivered through ScreenConnect was observed in post-compromise
      activity and used to collect information from victim devices.
    verified: true
