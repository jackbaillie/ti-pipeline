  evidence:
  - quote: Installation workflows used cmd.exe for logging, prerequisite checks, file
      management, and installation-related tasks.
    verified: true
  - quote: MSP360 and ScreenConnect were installed as Windows services to establish
      persistent access.
    verified: true
  - quote: MSP360 created registry Run entries to automatically launch tray application
      components at user logon.
    verified: true
  - quote: The combination of MSP360 and ScreenConnect provided the threat actor with
      redundant remote administration channels and enabled the transfer, execution,
      and management of additional tooling during subsequent stages of the intrusion.
    verified: true
  - quote: Following successful installation of MSP360 RMM, the newly installed RMM.Agent.exe
      service launched PowerShell.
    verified: true
  - quote: MSP360 downloaded ScreenConnect, while the threat actor’s use of ScreenConnect
      was subsequently used to transfer and execute additional tooling on compromised
      endpoints.
    verified: true
  - quote: The downloaded ClientSetup.msi package was installed silently using msiexec.exe
      /qn.
    verified: true
  - quote: MSP360 and ScreenConnect modified registry locations associated with services,
      persistence, credential provider components, protocol handlers, and uninstall
      entries.
    verified: true
  - quote: The execution of these files occurred through ScreenConnect’s built-in
      RunFile functionality, which allows files to be transferred to and executed
      on managed endpoints.
    verified: true
