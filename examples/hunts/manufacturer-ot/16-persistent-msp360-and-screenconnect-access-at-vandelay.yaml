    | where TimeGenerated >= ago(lookback)
    | where SHA256 in~ (iocs) or SHA1 in~ (iocs) or MD5 in~ (iocs)
    | extend MatchedIndicator = case(SHA256 in~ (iocs), tostring(SHA256), SHA1 in~ (iocs), tostring(SHA1), tostring(MD5))
    | project TimeGenerated, SourceTable = "DeviceEvents", MatchedIndicator, Device = tostring(DeviceName), User = tostring(InitiatingProcessAccountUpn), IP = ""
    ),
    (
    EmailAttachmentInfo
    | where TimeGenerated >= ago(lookback)
    | where SHA256 in~ (iocs)
    | extend MatchedIndicator = tostring(SHA256)
    | project TimeGenerated, SourceTable = "EmailAttachmentInfo", MatchedIndicator, Device = "", User = tostring(RecipientEmailAddress), IP = ""
    ),
    (
    CommonSecurityLog
    | where TimeGenerated >= ago(lookback)
    | where FileHash in~ (iocs)
    | extend MatchedIndicator = tostring(FileHash)
    | project TimeGenerated, SourceTable = "CommonSecurityLog", MatchedIndicator, Device = tostring(Computer), User = tostring(SourceUserName), IP = tostring(SourceIP)
    )
    | order by TimeGenerated desc
