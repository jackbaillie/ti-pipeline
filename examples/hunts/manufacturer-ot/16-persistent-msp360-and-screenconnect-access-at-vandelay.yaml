title: Persistent MSP360 and ScreenConnect access at Vandelay
status: prepared
prepare:
  trigger:
    document_id: 73
    title: Phishing Abuses RMM Tools for Persistent Access
    url: https://www.microsoft.com/en-us/security/blog/2026/09/29/phishing-abuses-rmm-tools-persistent-access/
    source_id: microsoft_ti
    published_at: '2026-09-29T21:39:27+00:00'
  priority: medium
  relevance_rationale: Abuse of MSP360 and ScreenConnect directly answers MO-PIR-4's
    question about malicious use of RMM software and merits a hunt this cycle. Persistent
    Windows remote access is relevant to an estate where vendors already use remote
    support tools for plant systems, although the report describes neither supplier-mediated
    access nor OT compromise.
  matched_pirs:
  - MO-PIR-4
  hypothesis: An unauthorised MSP360 deployment on a Vandelay Windows endpoint has
    installed ScreenConnect through PowerShell, established Windows persistence, and
    executed utilities transferred through ScreenConnect.
  scope: Search the last 30 days of Defender for Endpoint process, registry, file
    and network telemetry in Vandelay Industries’ Microsoft Sentinel workspace, focusing
    on onboarded Windows 10/11 office, warehouse and plant staff endpoints. Compare
    MSP360 and ScreenConnect activity with approved support deployments and vendor
    maintenance records, including existing TeamViewer and AnyDesk use. Prioritise
    endpoints with access to production support, SAP or Active Directory; the report
    does not establish supplier-mediated access or OT compromise.
