queries:
- id: 66
  kind: behavioural
  title: MSP360 launches PowerShell to install ScreenConnect
  purpose: Find the reported agent-launched PowerShell download followed by silent
    ClientSetup.msi installation. Direct-parent linkage and the one-hour correlation
    window are analyst inference.
  generated_by: llm
  technique_ids:
  - T1059.001
  - T1105
  - T1218.007
  - T1219
  tables:
  - DeviceProcessEvents
  validation:
    status: schema_valid
    tables:
    - DeviceProcessEvents
    unknown_tables: []
    unknown_columns: []
    messages: []
  benign_explanations:
  - An authorised MSP deploys ScreenConnect through an existing MSP360 agent.
  - IT is migrating support platforms or testing a second remote support channel.
  pivots:
  - Use DeviceId and PowerShellId to inspect surrounding process and file events,
    including the downloaded MSI.
  - Trace the MSP360 installation backwards to its installer, Downloads location and
    initiating user; correlate that user with email and URL-click telemetry.
  - Compare the deployment time, account and support tenant with approved change records.
  kql: |-
    let lookback = 30d;
    let Downloads = DeviceProcessEvents
    | where TimeGenerated >= ago(lookback)
    | where FileName =~ "powershell.exe"
    | where InitiatingProcessFileName =~ "RMM.Agent.exe"
    | where ProcessCommandLine contains "Invoke-WebRequest"
    | where isnotempty(ProcessUniqueId)
    | project DeviceId, DeviceName, DownloadTime = TimeGenerated, PowerShellId = ProcessUniqueId, DownloadAccount = AccountName, DownloadCommand = ProcessCommandLine, AgentCommand = InitiatingProcessCommandLine;
    let Installations = DeviceProcessEvents
    | where TimeGenerated >= ago(lookback)
    | where FileName =~ "msiexec.exe"
    | where ProcessCommandLine contains "ClientSetup.msi"
    | where ProcessCommandLine matches regex @"(?i)(^|\s)/qn(\s|$)"
    | where isnotempty(InitiatingProcessUniqueId)
    | project DeviceId, PowerShellId = InitiatingProcessUniqueId, InstallTime = TimeGenerated, InstallAccount = AccountName, InstallCommand = ProcessCommandLine;
    Downloads
    | join kind=inner Installations on DeviceId, PowerShellId
    | where InstallTime between (DownloadTime .. DownloadTime + 1h)
    | project DownloadTime, InstallTime, DeviceId, DeviceName, DownloadAccount, InstallAccount, AgentCommand, DownloadCommand, InstallCommand
- id: 67
  kind: behavioural
  title: RMM service and logon persistence changes
  purpose: Find registry writes consistent with the reported MSP360 and ScreenConnect
    service persistence and MSP360 Run entries. Standard Windows registry selectors
    are analyst inference; registry writes alone do not prove a functioning service.
  generated_by: llm
  technique_ids:
  - T1112
  - T1543.003
  - T1547.001
  tables:
  - DeviceRegistryEvents
  validation:
    status: schema_valid
    tables:
    - DeviceRegistryEvents
    unknown_tables: []
    unknown_columns: []
    messages: []
  benign_explanations:
  - Approved RMM installation or upgrade registers services and tray applications.
  - A support agent repair changes existing persistence values.
  pivots:
  - Inspect process events on DeviceId around each write to identify the installer
    and its ancestry.
  - Check subsequent RMM process launches and outbound connections on the same device.
  - Confirm the service or Run entry against the endpoint's approved software inventory
    and maintenance ticket.
  kql: |-
    let lookback = 30d;
    DeviceRegistryEvents
    | where TimeGenerated >= ago(lookback)
    | where ActionType == "RegistryValueSet"
    | where RegistryKey contains @"\SYSTEM\CurrentControlSet\Services\"
        or RegistryKey endswith @"\Software\Microsoft\Windows\CurrentVersion\Run"
    | where RegistryValueData contains "RMM.Agent"
        or RegistryValueData contains @"\RMM Agent\"
        or RegistryValueData contains "ScreenConnect"
        or InitiatingProcessFileName in~ ("RMM.Agent.exe", "RMM.Agent.Launcher.exe", "ScreenConnect.ClientService.exe", "ScreenConnect.WindowsClient.exe", "ScreenConnect.Client.exe")
    | extend PersistenceLocation = iff(RegistryKey contains @"\SYSTEM\CurrentControlSet\Services\", "Service registry", "Logon Run entry")
    | project TimeGenerated, DeviceId, DeviceName, PersistenceLocation, RegistryKey, RegistryValueName, RegistryValueData, PreviousRegistryValueData, InitiatingProcessAccountName, InitiatingProcessFileName, InitiatingProcessCommandLine
- id: 68
  kind: behavioural
  title: ScreenConnect stages and executes transferred utilities
  purpose: Correlate executable writes by ScreenConnect in the reported Documents\ScreenConnect\Temp
    staging locations with subsequent execution. This covers ordinary and OneDrive
    Documents paths. The one-hour window is analyst inference; execution alone does
    not establish credential access or collection.
  generated_by: llm
  technique_ids:
  - T1072
  - T1105
  tables:
  - DeviceFileEvents
  - DeviceProcessEvents
  validation:
    status: schema_valid
    tables:
    - DeviceFileEvents
    - DeviceProcessEvents
    unknown_tables: []
    unknown_columns: []
    messages: []
  benign_explanations:
  - A technician uses ScreenConnect's deployment functionality to run approved diagnostics.
  - An authorised software deployment stages and executes an installer in the support
    client's temporary directory.
  pivots:
  - Inspect each executable's metadata, command line and child processes to determine
    its function.
  - Review associated file activity and network connections using DeviceId and the
    execution time.
  - Compare the transferred utility and support session with the maintenance ticket;
    prioritise unexpected password, browser-data or security-control utilities.
  kql: |-
    let lookback = 30d;
    let StagedFiles = DeviceFileEvents
    | where TimeGenerated >= ago(lookback)
    | where ActionType in ("FileCreated", "FileModified")
    | where FolderPath endswith @"\Documents\ScreenConnect\Temp"
        or FolderPath contains @"\Documents\ScreenConnect\Temp\"
    | where FileName endswith ".exe"
    | where InitiatingProcessFileName in~ ("ScreenConnect.ClientService.exe", "ScreenConnect.WindowsClient.exe", "ScreenConnect.Client.exe")
    | extend FilePathKey = tolower(FolderPath), FileNameKey = tolower(FileName)
    | project DeviceId, FilePathKey, FileNameKey, StageTime = TimeGenerated, StageAction = ActionType, TransferProcess = InitiatingProcessFileName, TransferCommand = InitiatingProcessCommandLine;
    let Executions = DeviceProcessEvents
    | where TimeGenerated >= ago(lookback)
    | where FolderPath endswith @"\Documents\ScreenConnect\Temp"
        or FolderPath contains @"\Documents\ScreenConnect\Temp\"
    | where FileName endswith ".exe"
    | extend FilePathKey = tolower(FolderPath), FileNameKey = tolower(FileName)
    | project DeviceId, DeviceName, FilePathKey, FileNameKey, ExecutionTime = TimeGenerated, FileName, FolderPath, AccountName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine;
    StagedFiles
    | join kind=inner Executions on DeviceId, FilePathKey, FileNameKey
    | where ExecutionTime between (StageTime .. StageTime + 1h)
    | project StageTime, ExecutionTime, DeviceId, DeviceName, StageAction, FileName, FolderPath, AccountName, TransferProcess, TransferCommand, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine
- id: 69
  kind: behavioural
  title: Both RMM agents establish external connections
  purpose: Find endpoints where MSP360 and ScreenConnect both make successful public-address
    connections on the same day, supporting investigation of the reported redundant
    remote access channels. Same-day grouping is analyst inference and does not prove
    simultaneous interactive access.
  generated_by: llm
  technique_ids:
  - T1219
  tables:
  - DeviceNetworkEvents
  validation:
    status: schema_valid
    tables:
    - DeviceNetworkEvents
    unknown_tables: []
    unknown_columns: []
    messages: []
  benign_explanations:
  - An approved support arrangement deliberately maintains two RMM agents.
  - Both agents remain active during a migration or temporary vendor support engagement.
  pivots:
  - Inspect each agent's individual connections and command lines on DeviceId to identify
    its support instance.
  - Correlate the first observed connections with installation, persistence changes
    and ScreenConnect staging activity.
  - Check whether the endpoint supports production, SAP or Active Directory and confirm
    both remote access channels have an accountable owner.
  kql: |-
    let lookback = 30d;
    DeviceNetworkEvents
    | where TimeGenerated >= ago(lookback)
    | where ActionType == "ConnectionSuccess"
    | where RemoteIPType == "Public"
    | where InitiatingProcessFileName in~ ("RMM.Agent.exe", "RMM.Agent.Launcher.exe", "ScreenConnect.ClientService.exe", "ScreenConnect.WindowsClient.exe", "ScreenConnect.Client.exe")
    | extend AgentFamily = iff(InitiatingProcessFileName in~ ("RMM.Agent.exe", "RMM.Agent.Launcher.exe"), "MSP360", "ScreenConnect"), ConnectionDay = bin(TimeGenerated, 1d)
    | summarize FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated), ConnectionCount = count(), AgentFamilies = make_set(AgentFamily, 2), AgentProcesses = make_set(InitiatingProcessFileName, 10), RemoteAddresses = make_set(RemoteIP, 50), RemoteNames = make_set(RemoteUrl, 50), RemotePorts = make_set(RemotePort, 20), Accounts = make_set(InitiatingProcessAccountName, 20) by DeviceId, DeviceName, ConnectionDay
    | where array_length(AgentFamilies) == 2
    | project ConnectionDay, FirstSeen, LastSeen, DeviceId, DeviceName, ConnectionCount, AgentFamilies, AgentProcesses, RemoteAddresses, RemoteNames, RemotePorts, Accounts
- id: 70
  kind: ioc_sweep
  title: Retrospective domain IOC sweep
  purpose: Searches 30 days of logs for 7 reported domains. Sentinel TI-map rules
    match new events against ingested indicators; this sweep covers older logs.
  generated_by: template
  technique_ids: []
  tables:
  - DeviceNetworkEvents
  - DeviceEvents
  - DnsEvents
  - EmailUrlInfo
  - UrlClickEvents
  - CommonSecurityLog
  validation:
    status: schema_valid
    tables:
    - CommonSecurityLog
    - DeviceEvents
    - DeviceNetworkEvents
    - DnsEvents
    - EmailUrlInfo
    - UrlClickEvents
    unknown_tables: []
    unknown_columns: []
    messages: []
  benign_explanations:
  - Parked, sinkholed or re-registered domain, or a subdomain on shared hosting or
    dynamic DNS.
  - Mail filters or link scanners resolved the domain without a user visiting it.
  pivots:
  - Identify the process that resolved or connected to the domain and review its parent
    and command line.
  - Check DNS and proxy logs from the same device for first contact and regular beaconing.
  kql: |-
    let lookback = 30d;
    let iocs = dynamic(["adsaw.cfd", "adswre.cfd", "bunstar.harej.si", "ojsuyw.niyari.org", "sdfghj.rd-team.ru", "swedcorry.stefneyv.com", "trews.cfd"]);
    let ioc_terms = dynamic(["adsaw", "adswre", "bunstar", "ojsuyw", "sdfghj", "swedcorry", "trews"]);
    union isfuzzy=true
    (
    DeviceNetworkEvents
    | where TimeGenerated >= ago(lookback)
    | where RemoteUrl has_any (ioc_terms)
    | mv-apply MatchedIndicator = iocs to typeof(string) on (
        where (tostring(parse_url(iff(tolower(tostring(RemoteUrl)) contains "://", tolower(tostring(RemoteUrl)), strcat("https://", tolower(tostring(RemoteUrl))))).Host) == MatchedIndicator or tostring(parse_url(iff(tolower(tostring(RemoteUrl)) contains "://", tolower(tostring(RemoteUrl)), strcat("https://", tolower(tostring(RemoteUrl))))).Host) endswith strcat(".", MatchedIndicator))
    )
    | project TimeGenerated, SourceTable = "DeviceNetworkEvents", MatchedIndicator, Device = tostring(DeviceName), User = tostring(InitiatingProcessAccountUpn), IP = tostring(RemoteIP)
    ),
    (
    DeviceEvents
    | where TimeGenerated >= ago(lookback)
    | where RemoteUrl has_any (ioc_terms)
    | mv-apply MatchedIndicator = iocs to typeof(string) on (
        where (tostring(parse_url(iff(tolower(tostring(RemoteUrl)) contains "://", tolower(tostring(RemoteUrl)), strcat("https://", tolower(tostring(RemoteUrl))))).Host) == MatchedIndicator or tostring(parse_url(iff(tolower(tostring(RemoteUrl)) contains "://", tolower(tostring(RemoteUrl)), strcat("https://", tolower(tostring(RemoteUrl))))).Host) endswith strcat(".", MatchedIndicator))
    )
    | project TimeGenerated, SourceTable = "DeviceEvents", MatchedIndicator, Device = tostring(DeviceName), User = tostring(InitiatingProcessAccountUpn), IP = tostring(RemoteIP)
    ),
    (
    DnsEvents
    | where TimeGenerated >= ago(lookback)
    | where Name has_any (ioc_terms)
    | mv-apply MatchedIndicator = iocs to typeof(string) on (
        where (tostring(parse_url(iff(tolower(tostring(Name)) contains "://", tolower(tostring(Name)), strcat("https://", tolower(tostring(Name))))).Host) == MatchedIndicator or tostring(parse_url(iff(tolower(tostring(Name)) contains "://", tolower(tostring(Name)), strcat("https://", tolower(tostring(Name))))).Host) endswith strcat(".", MatchedIndicator))
    )
    | project TimeGenerated, SourceTable = "DnsEvents", MatchedIndicator, Device = tostring(Computer), User = "", IP = tostring(ClientIP)
    ),
    (
    EmailUrlInfo
    | where TimeGenerated >= ago(lookback)
    | where UrlDomain has_any (ioc_terms)
    | mv-apply MatchedIndicator = iocs to typeof(string) on (
        where (tostring(parse_url(iff(tolower(tostring(UrlDomain)) contains "://", tolower(tostring(UrlDomain)), strcat("https://", tolower(tostring(UrlDomain))))).Host) == MatchedIndicator or tostring(parse_url(iff(tolower(tostring(UrlDomain)) contains "://", tolower(tostring(UrlDomain)), strcat("https://", tolower(tostring(UrlDomain))))).Host) endswith strcat(".", MatchedIndicator))
    )
    | project TimeGenerated, SourceTable = "EmailUrlInfo", MatchedIndicator, Device = "", User = "", IP = ""
    ),
    (
    UrlClickEvents
    | where TimeGenerated >= ago(lookback)
    | where Url has_any (ioc_terms)
    | mv-apply MatchedIndicator = iocs to typeof(string) on (
        where (tostring(parse_url(iff(tolower(tostring(Url)) contains "://", tolower(tostring(Url)), strcat("https://", tolower(tostring(Url))))).Host) == MatchedIndicator or tostring(parse_url(iff(tolower(tostring(Url)) contains "://", tolower(tostring(Url)), strcat("https://", tolower(tostring(Url))))).Host) endswith strcat(".", MatchedIndicator))
    )
    | project TimeGenerated, SourceTable = "UrlClickEvents", MatchedIndicator, Device = "", User = tostring(AccountUpn), IP = tostring(IPAddress)
    ),
    (
    CommonSecurityLog
    | where TimeGenerated >= ago(lookback)
    | where DestinationHostName has_any (ioc_terms) or RequestURL has_any (ioc_terms)
    | mv-apply MatchedIndicator = iocs to typeof(string) on (
        where (tostring(parse_url(iff(tolower(tostring(DestinationHostName)) contains "://", tolower(tostring(DestinationHostName)), strcat("https://", tolower(tostring(DestinationHostName))))).Host) == MatchedIndicator or tostring(parse_url(iff(tolower(tostring(DestinationHostName)) contains "://", tolower(tostring(DestinationHostName)), strcat("https://", tolower(tostring(DestinationHostName))))).Host) endswith strcat(".", MatchedIndicator)) or (tostring(parse_url(iff(tolower(tostring(RequestURL)) contains "://", tolower(tostring(RequestURL)), strcat("https://", tolower(tostring(RequestURL))))).Host) == MatchedIndicator or tostring(parse_url(iff(tolower(tostring(RequestURL)) contains "://", tolower(tostring(RequestURL)), strcat("https://", tolower(tostring(RequestURL))))).Host) endswith strcat(".", MatchedIndicator))
    )
    | project TimeGenerated, SourceTable = "CommonSecurityLog", MatchedIndicator, Device = tostring(Computer), User = tostring(SourceUserName), IP = tostring(DestinationIP)
    )
    | order by TimeGenerated desc
