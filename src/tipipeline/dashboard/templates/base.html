<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' file:; script-src 'self' file:; base-uri 'none'; form-action 'none'">
  <title>{% block title %}Overview{% endblock %} · ti-pipeline</title>
  <link rel="stylesheet" href="{{ base }}style.css">
  <script src="{{ base }}app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="site-header">
    <div class="shell site-header-inner">
      <p class="brand">
        <a href="{{ base }}index.html">ti-pipeline</a>
        <span>Threat intel triage and hunt drafts</span>
      </p>
      <nav class="site-nav" aria-label="Main">
        {% for href, label, key in nav %}
        <a href="{{ base }}{{ href }}"{% if key == active %} aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <main class="shell" id="content">
    {% block content %}{% endblock %}
  </main>

  <footer class="shell site-footer">Snapshot {{ snapshot_label }}</footer>
  <div id="live-status" class="visually-hidden" role="status" aria-live="polite"></div>
</body>
</html>
