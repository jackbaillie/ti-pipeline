[project]
name = "ti-pipeline"
version = "0.1.0"
description = "Turns public threat reporting into customer-specific PEAK hunt packages with KQL for Microsoft Sentinel."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jack Baillie" }]
dependencies = [
  "httpx>=0.27",
  "feedparser>=6.0",
  "trafilatura>=1.12",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13",
  "jinja2>=3.1",
  "stix2>=3.0",
  "iocextract>=1.16",
  "tldextract>=5.1",
]

[project.scripts]
ti-pipeline = "tipipeline.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tipipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
