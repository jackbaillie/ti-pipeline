# Fictional organisation used to assess intelligence relevance and prepare hunts.
id: retail-bank
name: JLB Credit
short_name: JLB Credit
sector: Financial services (consumer lending)
region: United Kingdom
description: >-
  Fictional UK consumer lender (about 2,800 staff, 1.4 million customers) offering personal
  loans, credit cards and savings accounts, regulated by the PRA and FCA. Hybrid estate:
  on-premises Active Directory synchronised to Entra ID, Windows and Red Hat Enterprise Linux
  servers, Oracle databases behind the Temenos lending and savings platform, a SWIFT
  Alliance Access zone for treasury and funding payments, and Azure landing zones for the
  customer app and online account services. Remote access through Palo Alto GlobalProtect
  and F5 BIG-IP APM. Runs a 24x7 SOC on Microsoft Sentinel.
crown_jewels:
  - SWIFT messaging zone and payment release workflow
  - Lending and savings ledger and customer account data
  - Faster Payments, loan disbursement and card processing systems
  - Privileged identities (domain admins, PAM vault, Azure subscription owners)
  - Customer personal and financial data in Oracle databases
technologies:
  - vendor: Palo Alto Networks
    product: PAN-OS GlobalProtect
    exposure: internet_facing
    notes: Staff and third-party VPN; firewall and VPN logs sent to Sentinel via CEF.
  - vendor: F5
    product: BIG-IP LTM / APM
    exposure: internet_facing
    notes: Load balancing and access policy for online account services and broker APIs.
  - vendor: Microsoft
    product: Active Directory Domain Services
    exposure: internal
    notes: Monitored by Defender for Identity.
  - vendor: Microsoft
    product: Entra ID
    exposure: cloud_service
  - vendor: Microsoft
    product: Microsoft 365 / Exchange Online
    exposure: cloud_service
  - vendor: Microsoft
    product: Defender XDR (Endpoint, Office 365, Identity, Cloud Apps)
    exposure: cloud_service
  - vendor: Microsoft
    product: Windows Server
    exposure: internal
  - vendor: Microsoft
    product: Azure
    exposure: cloud_service
    notes: Landing zones hosting the customer app back end and account APIs.
  - vendor: Red Hat
    product: Red Hat Enterprise Linux
    exposure: internal
    notes: Application and middleware servers; syslog forwarded to Sentinel.
  - vendor: Oracle
    product: Oracle Database
    exposure: internal
  - vendor: SWIFT
    product: Alliance Access / Alliance Gateway
    exposure: internal
    notes: Isolated payments zone following the SWIFT Customer Security Programme.
  - vendor: Temenos
    product: Transact (core lending and savings)
    exposure: internal
  - vendor: CyberArk
    product: Privileged Access Manager
    exposure: internal
pirs:
  - id: RB-PIR-1
    question: >-
      Which financially motivated threat actors are targeting UK lenders, banks and
      financial services, and which initial access, ransomware and extortion methods are they using?
    theme: ransomware
    keywords:
      - bank
      - banking
      - lender
      - consumer credit
      - financial services
      - financial sector
      - financially motivated
      - ransomware
      - extortion
      - United Kingdom
      - UK
  - id: RB-PIR-2
    question: >-
      Is there activity aimed at compromising payment systems (SWIFT, Faster Payments,
      card processing) or committing payment, card or loan fraud through our infrastructure?
    theme: bec
    keywords:
      - SWIFT
      - payment system
      - Faster Payments
      - fraudulent transfer
      - card fraud
      - loan fraud
      - ATM
      - core banking
      - Lazarus
  - id: RB-PIR-3
    question: >-
      Are edge devices we run (Palo Alto GlobalProtect, F5 BIG-IP) or comparable VPN and
      application delivery products being actively exploited?
    theme: edge
    keywords:
      - Palo Alto
      - PAN-OS
      - GlobalProtect
      - F5
      - BIG-IP
      - edge device
      - VPN
      - firewall
      - remote code execution
      - zero-day
  - id: RB-PIR-4
    question: >-
      Which identity attacks against Active Directory, Entra ID and privileged access
      (credential theft, MFA bypass, help-desk social engineering, token theft) are in use?
    theme: identity
    keywords:
      - Active Directory
      - Entra ID
      - Kerberoasting
      - credential theft
      - MFA bypass
      - help desk
      - social engineering
      - token theft
      - privileged access
      - Scattered Spider
  - id: RB-PIR-5
    question: >-
      Are third-party suppliers, managed service providers or software supply chains we
      depend on being compromised to reach financial institutions?
    theme: third-party
    keywords:
      - supply chain
      - third party
      - managed service provider
      - MSP
      - software update
      - trojanised
      - vendor compromise
