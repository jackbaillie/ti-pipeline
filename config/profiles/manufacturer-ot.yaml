# Fictional organisation used to assess intelligence relevance and prepare hunts.
id: manufacturer-ot
name: Vandelay Industries
short_name: Vandelay Industries
sector: Manufacturing and import/export (latex goods)
region: United Kingdom
description: >-
  Fictional UK import/export business (about 900 staff) that also manufactures latex
  goods, mainly gloves, tubing and moulded parts, in its own Midlands plant and ships them
  from its own warehouse. On-premises Active Directory and Windows servers, SAP ERP for
  production planning, orders, customs and shipping, FortiGate firewalls with SSL VPN,
  and a plant floor running Siemens and Rockwell PLCs and HMIs on the dipping and curing
  lines. Equipment vendors support plant systems through TeamViewer and AnyDesk.
crown_jewels:
  - Production lines and OT control systems (PLCs, HMIs, engineering workstations)
  - SAP ERP production planning, orders, supplier, customs and shipping data
  - Latex compound formulations and quality records
  - Active Directory domain controllers and backup infrastructure
technologies:
  - vendor: Microsoft
    product: Active Directory Domain Services
    exposure: internal
  - vendor: Microsoft
    product: Windows Server
    exposure: internal
  - vendor: Microsoft
    product: Windows 10 / 11
    exposure: endpoint
    notes: IT laptops and desktops onboarded to Defender for Endpoint.
  - vendor: Microsoft
    product: Entra ID / Microsoft 365
    exposure: cloud_service
    notes: Synchronised identities for office, warehouse and plant staff.
  - vendor: Fortinet
    product: FortiGate (FortiOS SSL VPN)
    exposure: internet_facing
    notes: Perimeter firewall and staff VPN; logs sent to Sentinel via CEF.
  - vendor: SAP
    product: SAP ERP (S/4HANA)
    exposure: internal
  - vendor: VMware
    product: vSphere / ESXi
    exposure: internal
    notes: Hosts most IT servers; not onboarded to Defender.
  - vendor: Veeam
    product: Backup & Replication
    exposure: internal
  - vendor: Siemens
    product: SIMATIC S7 PLCs and WinCC HMI
    exposure: ot
  - vendor: Rockwell Automation
    product: ControlLogix PLCs and FactoryTalk
    exposure: ot
  - vendor: TeamViewer
    product: TeamViewer
    exposure: endpoint
    notes: Used by equipment vendors for remote support of plant systems.
  - vendor: AnyDesk
    product: AnyDesk
    exposure: endpoint
    notes: Used by a machine-tool vendor for remote support.
pirs:
  - id: MO-PIR-1
    question: >-
      Which ransomware and extortion groups are targeting manufacturers, and which access,
      lateral movement and encryption techniques (including against ESXi and backups) are they using?
    theme: ransomware
    keywords:
      - manufacturing
      - manufacturer
      - industrial
      - ransomware
      - extortion
      - ESXi
      - Veeam
      - backup
  - id: MO-PIR-2
    question: >-
      Is there activity targeting industrial control systems or OT environments, especially
      Siemens and Rockwell Automation products?
    theme: ot
    keywords:
      - ICS
      - OT
      - operational technology
      - SCADA
      - PLC
      - HMI
      - Siemens
      - SIMATIC
      - Rockwell
      - ControlLogix
      - FactoryTalk
  - id: MO-PIR-3
    question: >-
      Are FortiGate SSL VPN or comparable perimeter devices being actively exploited for
      initial access?
    theme: edge
    keywords:
      - Fortinet
      - FortiGate
      - FortiOS
      - SSL VPN
      - VPN
      - edge device
      - firewall
      - zero-day
  - id: MO-PIR-4
    question: >-
      Are threat actors abusing third-party remote access tools (TeamViewer, AnyDesk, other
      RMM software) or supplier access to reach victim networks?
    theme: remote-access
    keywords:
      - TeamViewer
      - AnyDesk
      - remote monitoring and management
      - RMM
      - remote access tool
      - ScreenConnect
      - supplier access
      - third party
  - id: MO-PIR-5
    question: >-
      Which Microsoft 365 and Entra ID identity attacks (adversary-in-the-middle phishing,
      token theft, MFA fatigue, password spraying) could give access to staff, supplier or
      customs and shipping accounts?
    theme: identity
    keywords:
      - Microsoft 365
      - Entra ID
      - Azure AD
      - token theft
      - adversary-in-the-middle
      - AiTM
      - password spraying
      - MFA fatigue
      - session cookie
