# Sentinel (Log Analytics) table schemas used to validate generated KQL.
#
# Column lists follow the Azure Monitor Logs table reference
# (https://learn.microsoft.com/azure/azure-monitor/reference/tables/), i.e. the
# schema of each table in a Microsoft Sentinel workspace. Defender XDR tables
# streamed to Sentinel also carry the advanced hunting `Timestamp` column
# (https://learn.microsoft.com/defender-xdr/advanced-hunting-schema-tables).
# Log Analytics standard columns (TimeGenerated, TenantId, Type) are listed on
# every table; hidden underscore columns (_ResourceId, _BilledSize, ...) are
# accepted by the validator without being listed.
# Retrieved 2026-10-05.

